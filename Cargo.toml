[workspace]
resolver = "3"
members = ["sqlite-jieba-tokenizerxx", "sqlite-simple-tokenizer"]

[workspace.package]
authors = ["Cathy Luking <cathyluking@foxmail.com>"]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
env_logger = "0.11.8"
jieba-rs = "0.8.1"
log = "0.4.29"
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
phf_codegen = "0.13.1"
rusqlite = { version = "0.38.0", default-features = false, features = ["bundled", "functions", "vtab", "array"] }
waken_snowball = "0.1.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12.0"
