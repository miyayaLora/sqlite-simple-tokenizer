[workspace]
resolver = "3"
members = ["rusqlite-ext", "sqlite-chinese-stopword", "sqlite-jieba-tokenizer", "sqlite-simple-tokenizer", "sqlite-english-stemmer"]

[workspace.package]
authors = ["Cathy Luking <cathyluking@foxmail.com>"]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
env_logger = "0.11.8"
jieba-rs = "0.8.1"
log = "0.4.29"
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
phf_codegen = "0.13.1"
rusqlite = { version = "0.38.0", default-features = false, features = ["bundled", "functions", "vtab", "array"] }
rusqlite-ext = { path = "rusqlite-ext", version = "0.38.0" }
sqlite-chinese-stopword = { path = "sqlite-chinese-stopword", version = "0.1.0" }
sqlite-english-stemmer = { path = "sqlite-english-stemmer", version = "0.1.0" }
sqlite-jieba-tokenizer = { path = "sqlite-jieba-tokenizer", version = "0.1.0" }
unicode-segmentation = "1.12.0"
